name: investment_risk_mart
version: "1.0.0"
config-version: 2

profile: investment_risk_mart

model-paths: ["models"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

seeds:
  investment_risk_mart:
    +schema: bronze
    yfinance_to_cusip:
      +column_types:
        ticker: text
        cusip: text
        notes: text
    governance:
      +schema: marts
      certification_registry:
        +column_types:
          model_name: text
          domain: text
          owner_role: text
          certification_status: text
          certification_date: text
          certified_by_role: text
          required_controls: text
          controls_passed: text
          open_exceptions: text
          notes: text
          evidence_location: text

models:
  investment_risk_mart:
    bronze:
      +materialized: view
      +schema: bronze_dbt
    silver:
      +materialized: table
      +schema: silver
    marts:
      +materialized: table
      +schema: marts
    recon:
      +materialized: table
      +schema: recon
