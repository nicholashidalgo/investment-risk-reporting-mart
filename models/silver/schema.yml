version: 2

models:
  - name: dim_security
    description: One row per security with latest credit rating resolved.
    columns:
      - name: sec_id
        description: Primary key — unique security identifier.
        data_tests:
          - not_null
          - unique
      - name: asset_class
        description: Broad asset class.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Equity", "Fixed Income", "Benchmark"]
      - name: rating
        description: Most recent credit rating (falls back to security master rating).

  - name: dim_portfolio
    description: One row per distinct portfolio.
    columns:
      - name: portfolio_id
        description: Primary key — unique portfolio identifier.
        data_tests:
          - not_null
          - unique

  - name: dim_benchmark
    description: One row per distinct benchmark.
    columns:
      - name: benchmark_id
        description: Primary key — unique benchmark identifier.
        data_tests:
          - not_null
          - unique

  - name: dim_date
    description: Date spine covering the full range of position and price dates.
    columns:
      - name: date_day
        description: Primary key — calendar date.
        data_tests:
          - not_null
          - unique
      - name: year
        description: Calendar year.
        data_tests:
          - not_null
      - name: month
        description: Calendar month (1-12).
        data_tests:
          - not_null
      - name: is_weekend
        description: True for Saturday and Sunday.
        data_tests:
          - not_null

  - name: fct_position_daily
    description: Daily portfolio holdings; grain is portfolio_id x sec_id x position_date.
    columns:
      - name: portfolio_id
        description: Portfolio identifier.
        data_tests:
          - not_null
      - name: sec_id
        description: Security identifier.
        data_tests:
          - not_null
      - name: position_date
        description: As-of date for the holding.
        data_tests:
          - not_null
      - name: market_value
        description: Market value in USD.
        data_tests:
          - not_null
      - name: weight
        description: Portfolio weight as a decimal fraction.
        data_tests:
          - not_null

  - name: fct_price_daily
    description: Daily closing prices; grain is sec_id x price_date.
    columns:
      - name: sec_id
        description: Security identifier.
        data_tests:
          - not_null
      - name: price_date
        description: Price observation date.
        data_tests:
          - not_null
      - name: price
        description: Closing price.
        data_tests:
          - not_null

  - name: fct_benchmark_return_daily
    description: Daily benchmark total returns; grain is benchmark_id x benchmark_date.
    columns:
      - name: benchmark_id
        description: Benchmark identifier.
        data_tests:
          - not_null
      - name: benchmark_date
        description: Return observation date.
        data_tests:
          - not_null
      - name: return
        description: Daily total return as a decimal.
        data_tests:
          - not_null

  - name: dim_security_history
    description: >
      Type 2 SCD history for dim_security. One row per sec_id × version (dbt_valid_from).
      Sourced from dim_security_snapshot (strategy: check on all attribute columns).
      Use this model for historical and point-in-time queries.
    columns:
      - name: security_key
        description: Surrogate key — hash of sec_id + valid_from. Unique per SCD version row.
        data_tests:
          - not_null
          - unique
      - name: sec_id
        description: Natural key — unique security identifier.
        data_tests:
          - not_null
      - name: valid_from
        description: Timestamp when this version of the security record became active (dbt_valid_from).
        data_tests:
          - not_null
      - name: valid_to
        description: Timestamp when this version was superseded (dbt_valid_to); NULL means currently active.
      - name: is_current
        description: True if this is the currently active version for this sec_id.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: scd_id
        description: dbt-generated hash identifier for this snapshot row (dbt_scd_id).
        data_tests:
          - not_null
          - unique
      - name: asset_class
        description: Broad asset class (Equity, Fixed Income, or Benchmark).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Equity", "Fixed Income", "Benchmark"]

  - name: dim_security_current
    description: >
      Current-state view over dim_security_history where is_current = true.
      One row per sec_id. Use this model for all fact-table joins requiring latest security attributes.
      For point-in-time queries use dim_security_history with a date filter on valid_from / valid_to.
    columns:
      - name: security_key
        description: Surrogate key — unique per sec_id in this view.
        data_tests:
          - not_null
          - unique
      - name: sec_id
        description: Natural key — unique security identifier.
        data_tests:
          - not_null
          - unique
      - name: valid_from
        description: Timestamp when the current version of this record became active.
        data_tests:
          - not_null
      - name: asset_class
        description: Broad asset class (Equity, Fixed Income, or Benchmark).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Equity", "Fixed Income", "Benchmark"]
